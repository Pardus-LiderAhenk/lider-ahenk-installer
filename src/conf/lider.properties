################### DataSource Configuration ##########################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://##DATABASEADDRESS##:3306/##DATABASENAME##?useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username=##DATABASEUSERNAME##
spring.datasource.password=##DATABASAPASSWORD##

################### Hibernate Configuration ##########################
#spring.jpa.show-sql=true
spring.datasource.initialization-mode=always
spring.main.banner-mode=off
logging.pattern.console=%clr(%d{yy-MM-dd E HH:mm:ss.SSS}){blue} %clr(%-5p) %clr(%logger{0}){blue} %clr(%m){faint}%n
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
logging.level.org.springframework.web= INFO
logging.level.org.hibernate= INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
server.servlet.session.timeout=30m
spring.jackson.serialization.fail-on-empty-beans=false
################### Register Configuration ##########################
registrationSubscriber.class = default

################### Messaging Configuration ##########################
lider.messaging = xmpp

################### XMPP Configuration ##############################
xmpp.resource.name=Smack
xmpp.presence.priority=1

################### Plugin Configuration ############################
### VNC ( only false or true) ###
allow.connection.without.permission = true

## Delete user for AD (only true or false)
lider.enableDelete4Directory = false

################### Lider Server Configuration ############################
# JWT properties
jwt.secret = ##JWTSECRET##
jwt.expiration = 3600

# Lider URL For Forgot Password
lider.url = ##LIDERSERVER##

#swagger config
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.resolve-schema-properties=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

refresh.token.expiry.seconds=86400
refresh.token.cleanup.batch-size =1000
refresh.token.cleanup.cron=0 * * * * *

lider.guacamole.guacd.host=##LIDERSERVER##
lider.guacamole.guacd.port=4822

spring.main.allow-circular-references=true